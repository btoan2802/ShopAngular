<div class="product-grid">
    @for (product of products(); track product.id) {
    <div class="product-card" [routerLink]="['/product', product.id]">
        <h3>{{ product.name }}</h3>
        <p class="description">{{ product.description }}</p>
        <p class="price">{{ product.price | number }} đ</p>

        @if (product.stock > 0) {
        <p class="in-stock">Còn {{ product.stock }} sản phẩm</p>
        } @else {
        <p class="out-of-stock">Hết hàng</p>
        }
    </div>
    }
</div>
