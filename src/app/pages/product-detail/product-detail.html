<a routerLink="/" class="back-link">← Quay lại danh sách</a>

@if (product(); as product) {
<div class="detail-card">
    <h2>{{ product.name }}</h2>
    <p class="description">{{ product.description }}</p>
    <p class="price">{{ product.price | number }} đ</p>

    @if (product.stock > 0) {
    <p class="in-stock">Còn {{ product.stock }} sản phẩm</p>
    } @else {
    <p class="out-of-stock">Hết hàng</p>
    }
    <button class="add-to-cart" (click)="addToCart()" [disabled]="product.stock === 0">
        Thêm vào giỏ
    </button>
</div>
} @else if (errorMessage()) {
<p class="error">{{ errorMessage() }}</p>
} @else {
<p>Đang tải...</p>
}
